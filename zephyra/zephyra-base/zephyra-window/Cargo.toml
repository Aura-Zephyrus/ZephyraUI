[package]
name = "zephyra-window"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "窗口集合（WindowSet）：每线程一个协调者，持有多个顶层窗口；与渲染后端无关"

# # 为什么这一层住在 base，而不是 zephyra-fx
#
# `zephyra-fx` 不依赖 winit（它是"后端无关的那一半"），而 `WindowSet` 必须知道
# `ActiveEventLoop` / `WindowEvent` / `WindowId` —— 那是 winit 的词汇。
#
# # 为什么不是每个后端各写一份
#
# 事件按 `WindowId` 分发、owned 窗口级联关闭、最后窗口关闭退出事件循环 ——
# 这三条判据与 D3D11 / D3D12 / Vulkan 都无关。抄三份的下场是"三个后端对同一个
# 关闭顺序给出三种解释"，而那种差异不会在编译期暴露。
#
# 与 WinUI 的对应关系（`E:\microsoft-ui-xaml`）：
#   WindowSet        ≈ DXamlCore（每线程一份，持有 HWND→Window 表）
#   WindowHost       ≈ DesktopWindowImpl（每窗口一个，持有自己的交换链/内容树）
#   WindowHandle     ≈ Microsoft::UI::Xaml::Window（应用侧句柄，线程亲和）
#   ShutdownMode     ≈ DispatcherShutdownMode（OnLastWindowClose / OnExplicitShutdown）
[dependencies]
zephyra-core = { path = "../../zephyra-core", version = "0.1.0" }
zephyra-fx = { path = "../../zephyra-fx" }
zephyra-app-config = { path = "../zephyra-app-config" }
winit = "0.30"

[lints.rust]
unsafe_code = "forbid"
