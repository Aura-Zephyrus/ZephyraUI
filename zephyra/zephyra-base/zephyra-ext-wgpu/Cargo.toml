[package]
name = "zephyra-ext-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
description = "wgpu interop for Zephyra extension contracts: AdapterIdentity conversion and wgpu-friendly helpers. Optional; keeps zephyra-render-ext/zephyra-ext wgpu-free (S5)."

# Optional interop crate: not for default-members. Users who build extensions with wgpu
# depend on this crate (and/or enable it in their app) without pulling wgpu into the
# contract crates.
[features]
default = []
# S5: 用户侧 wgpu 开发辅助（类型转换/facade）；不向 zephyra-render-ext/zephyra-ext 注入依赖。
facade = []
# 原生句柄/hal 接线（unsafe，feature-gated）。API 随 wgpu/wgpu-hal 版本变化，按实际版本调整。
native = ["dep:wgpu-hal"]
native-dx12 = ["native", "dep:windows"]

[dependencies]
zephyra-render-ext = { path = "../zephyra-render-ext" }
wgpu = "24"
wgpu-hal = { version = "24", optional = true }
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Security",
] }
