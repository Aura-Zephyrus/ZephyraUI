[package]
name = "zephyra-uia"
version = "0.1.0"
edition = "2021"
description = "Windows UI Automation (UIA) raw provider over the zephyra retained node tree"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
publish = false

# 默认**什么都不开**。
#
# 这个 crate 整段都是 Windows 的 COM 边界（VARIANT / SAFEARRAY / HWND 子类），
# 而绝大多数应用根本不需要无障碍 —— 默认带上它，只会让「默认构建」平白多一棵
# 依赖树。与 `zephyra-camera` 同一理由。
[features]
default = []

[dependencies]
# 只用它的**几何**类型（`Rect`）与节点树 —— 模型与规则那一半是平台中立的，
# 于是「这棵树长什么样」在任何机器上都能断言（Linux CI 上跑不了屏读器）。
zephyra-core = { path = "../../../zephyra-core" }

[target.'cfg(windows)'.dependencies]
# `#[implement]` 宏生成的代码里写的是 `::windows_core::…` 的绝对路径 ——
# 所以 `windows_core` 必须是**直接**依赖（靠 `windows` 转出不行：宏展开时
# 那个名字得在 crate 根可见）。版本必须与 `windows` 用的那个一致。
windows-core = "0.62"
windows = { version = "0.62", features = [
  # IRawElementProviderSimple / IRawElementProviderFragment / UiaRaiseAutomationEvent
  "Win32_UI_Accessibility",
  # HWND / LPARAM / LRESULT / WPARAM / RECT
  "Win32_Foundation",
  # GetModuleHandleW（测试里建真窗口要用）
  "Win32_System_LibraryLoader",
  # WM_GETOBJECT 与窗口过程子类
  "Win32_UI_WindowsAndMessaging",
  # WNDCLASSW 里带 HBRUSH/HICON 等 GDI 句柄（测试里建真窗口要用）
  "Win32_Graphics_Gdi",
  # IUnknown / SAFEARRAY
  "Win32_System_Com",
  # BSTR ↔ VARIANT 的互转（读回 VT_BSTR 属性值时要用）
  "Win32_System_Com_StructuredStorage",
  # SafeArrayCreateVector / SafeArrayPutElement（BoundingRectangle 那个数组）
  "Win32_System_Ole",
  # VARIANT
  "Win32_System_Variant",
] }

[lints.rust]
# 这个 crate **整段**都是 unsafe：COM 的 vtable、HWND 子类、SAFEARRAY 都要手写。
#
# 与仓库其余部分同一条纪律（`zephyra-base/README.md`）：unsafe 只允许出现在
# 「必须直接碰系统」的那一小块里，且那一块要能一眼指出来 —— 所以本 crate
# 整个就是那一块，而不是在别处零星撒。
unsafe_code = "allow"
