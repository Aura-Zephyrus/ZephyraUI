[package]
name = "zephyra-ui"
description = "ZephyraUI widget layer: control stylesheets, theme tokens and the .zypui structure library. Carries no backend and no app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# 这个 crate 是**库**，不是应用。
#
# # 它不依赖任何渲染后端
#
# 旧版本这里同时装着控件层和 gallery 应用，于是它依赖 `zephyra-winit-d3d12`
# 并有一个 `bin/gallery.rs`。代价是：库的使用者被迫拿到一整套图形栈依赖，
# 而「控件长什么样」与「谁把它画上屏」本就是两件事。
#
# 现在后端由**应用**（`gallery/`）用 feature 选，控件库只产出结构与样式。
#
# # 它也不含任何应用状态
#
# 路由、页面、i18n 文案表都不在这里 —— 那些属于 gallery。判据很简单：
# **换一个应用还能用吗？** 控件样式表能，导航栏的路由表不能。
[dependencies]
zephyra-core = { path = "../../ZephyraCore/zephyra-core" }
zephyra-fx = { path = "../../ZephyraCore/zephyra-fx" }
zephyra-svg-anim = { path = "../../ZephyraCore/zephyra-svg-anim" }
zephyra-bezier = { path = "../../ZephyraCore/zephyra-core/extra/zephyra-bezier" }
zephyra-style = { path = "../../ZephyraCore/zephyra-style" }

# ⚠️ 控件的**文案**归应用，不归这里：同一个 Button 在不同应用里
# 叫 "确定" / "OK" / "Submit"。控件只发 key，文案表是应用的。
#
# ⚠️ 2026-11-01 起这里**确实**用到了 `zephyra_core::i18n`（BCP47 / Messages），
#    但只用在 `src/i18n.rs` 一处：控件**自身语义**的文案（复选框组组头的
#    「全选」）需要自带默认译文 + 一张「哪些实参收语义 key」的契约表。
#    控件模板的文案参数收 key、翻译在控件内部发生 ⇒ 控件层不发面向用户的
#    文案（门禁做在 gallery/tests/gates.rs）。
#
#    应用自己的文案表仍然归应用 —— 控件层只提供**合并**入口
#    （`zephyra_ui::i18n::merge_builtin`，应用条目优先）。
#
# ⚠️ `zephyra-style` 现在确实在用：`motion.rs` 的补间用它的 `Easing` / `progress`
#    / `step_with` —— 控件状态模型里的补间属于框架，不该由每个应用自己写。
#    曾经这里还有 `zephyra-style`（注释说控件要用 `WidthClass` / `Easing`）
#    与 `zypui`（`src/ui.rs` 的运行时组件入口）。实测两者在本 crate 的 .rs 里
#    一次都没出现：.zypui 的编译由**应用**的 build.rs 做（gallery 直接读
#    `ui/controls.zypui` 文件），不经由本 crate。见
#    `docs/dev-log/2026-10-28-zephyra-ui-single-source.md`。

# 门禁只用：跨仓解析控件样式表，让主仓 `cargo test --workspace` 自己覆盖
# 「令牌存在 / 分类名有规则 / 模板无字面文案」，而不是等应用仓的红。
[dev-dependencies]
zstyle-compile = { path = "../../ZephyraCore/zstyle-compile" }

[lib]
name = "zephyra_ui"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
