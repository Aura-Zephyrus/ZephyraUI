[package]
name = "zephyra-ui"
description = "ZephyraUI widget layer: control stylesheets, theme tokens and the .zypui structure library. Carries no backend and no app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# 这个 crate 是**库**，不是应用。
#
# # 它不依赖任何渲染后端
#
# 旧版本这里同时装着控件层和 gallery 应用，于是它依赖 `zephyra-winit-d3d12`
# 并有一个 `bin/gallery.rs`。代价是：库的使用者被迫拿到一整套图形栈依赖，
# 而「控件长什么样」与「谁把它画上屏」本就是两件事。
#
# 现在后端由**应用**（`gallery/`）用 feature 选，控件库只产出结构与样式。
#
# # 它也不含任何应用状态
#
# 路由、页面、i18n 文案表都不在这里 —— 那些属于 gallery。判据很简单：
# **换一个应用还能用吗？** 控件样式表能，导航栏的路由表不能。
[dependencies]
zephyra-core = { path = "../zephyra/zephyra-core" }

# ⚠️ 控件的**文案**归 gallery，不归这里：同一个 Button 在不同应用里
# 叫 "确定" / "OK" / "Submit"。控件只发 key，文案表是应用的。
#
#    所以 `zephyra_core::i18n`（BCP47 / Messages）**不**在这里出现。
#
# ⚠️ 曾经这里还有 `zephyra-style`（注释说控件要用 `WidthClass` / `Easing`）
#    与 `zypui`（`src/ui.rs` 的运行时组件入口）。实测两者在本 crate 的 .rs 里
#    一次都没出现：.zypui 的编译由**应用**的 build.rs 做（gallery 直接读
#    `ui/controls.zypui` 文件），不经由本 crate。见
#    `docs/dev-log/2026-10-28-zephyra-ui-single-source.md`。

[lib]
name = "zephyra_ui"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
