[workspace]
resolver = "2"
# 主仓只保留 zephyra-ui 控件层库；core、编译器栈与全部后端已迁至独立仓 ZephyraCore。
# 见 https://github.com/Aura-Zephyrus/ZephyraCore
members = [
    # 主仓只剩控件层库；core、编译器栈与全部后端已迁至 ZephyraCore。
    "ZephyraUI",
]

default-members = [
    "ZephyraUI",
]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
