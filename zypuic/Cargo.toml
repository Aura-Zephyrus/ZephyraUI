[package]
name = "zypuic"
description = "ZephyraUI UI-file compiler: hand-written XML-subset parser + validation + binary encoding for .zypui sources. The runtime half lives in zypui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# `.zypui` 的**编译期**半边（对位 zstylec 之于 zephyra-style）。
#
# # 为什么既是 bin 又是 lib
#
# bin 是命令行工具（`zypuic check` 进 CI；`compile` 产出 .bin）。
# lib 给 **build.rs** 用：应用在构建期直接调 `compile()` 把 `.zypui` 编进
# `OUT_DIR`，`include_bytes!` 吃进运行时 —— 「编译为二进制、无运行时解析」
# 的落地路径。也给 **dev 模式**用：宿主运行期 `parse` 文本、热迭代，
# 与 zstylec 的 dev 模式同一先例。
#
# # 解析器为什么手写
#
# 本仓的解析器都是手写的（zstylec 的 CSS 子集、core 的 SVG path、icon 解析器）。
# XML 子集足够小（元素/属性/注释/实体），引一个 XML 依赖换来的不是正确性
# 而是报错质量的两难 —— 手写解析器每一条错误都带行号列号和中文说明。

[dependencies]
# 只依赖 IR 与运行时值类型 —— 编码/解码同源的另一半在 zypui::decode。
zypui = { path = "../zypui" }
# NodeTag（裸元素标签的合法性表）来自核心；与 zstylec 依赖 core 同一条理由。
zephyra-core = { path = "../zephyra/zephyra-core" }

[lib]
name = "zypuic"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
